name: Build watch app

# Builds on every push that changes the app itself. Pushes that only touch
# config/settings.json, docs or markdown do not need a build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "config/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Read the app version
        id: ver
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### ChargeGuard v$name (code $code)" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the APK under Artifacts below. The watch's status screen should read: App v$name ($code)." >> "$GITHUB_STEP_SUMMARY"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chargeguard-v${{ steps.ver.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
